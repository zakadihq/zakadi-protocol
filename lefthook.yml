# Zakadi repository standard: git hooks (lefthook 2.x) for the protocol repository.
# The commands are the ones .github/workflows/ci.yml runs. Install: brew install lefthook,
# then lefthook install. Three parts: the conformance project (uv) and the two npm
# packages, each keyed on its path.

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: secrets
      glob: "**/.env*"
      run: 'echo "secrets: {staged_files} must not be committed (spec 00 0.11)" >&2; exit 1'
    - name: lock
      glob: "conformance/{pyproject.toml,uv.lock}"
      run: uv lock --check --project conformance
    - name: checks
      group:
        parallel: true
        jobs:
          - name: format
            glob: "conformance/**/*.py"
            run: uv run --project conformance --frozen ruff format --check {staged_files}
          - name: lint
            glob: "conformance/**/*.py"
            run: uv run --project conformance --frozen ruff check {staged_files}
          # The package scripts over the whole package, keyed on its path: lefthook's
          # root: option treats packages/npm as a prefix of packages/npm-zakadi.
          - name: format-npm
            glob: "packages/npm/**"
            run: npm --prefix packages/npm run format
          - name: lint-npm
            glob: "packages/npm/**"
            run: npm --prefix packages/npm run lint
          - name: format-npm-zakadi
            glob: "packages/npm-zakadi/**"
            run: npm --prefix packages/npm-zakadi run format
          - name: lint-npm-zakadi
            glob: "packages/npm-zakadi/**"
            run: npm --prefix packages/npm-zakadi run lint

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    - name: types
      run: cd conformance && uv run --frozen ty check
    - name: unit
      run: uv run --project conformance --frozen pytest -q
    - name: unit-npm
      run: for p in packages/npm packages/npm-zakadi; do (cd "$p" && npm test) || exit 1; done
